<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MES Risk Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 p-4 font-sans flex justify-center items-start min-h-screen">
    <div class="w-full max-w-lg bg-white rounded-xl shadow-lg p-5 border border-slate-200 mt-4">
        <h1 class="text-xl font-bold text-slate-800 mb-4 border-b pb-2">MES Risk Dashboard</h1>

        <div class="space-y-5">
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Current VIX</label>
                    <input type="number" id="vix" value="18" step="0.1" class="w-full rounded-lg border-slate-300 shadow-sm p-1.5 border focus:ring-blue-500 focus:border-blue-500" oninput="calculateRisk()">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Cash Balance ($15,000)</label>
                    <input type="number" id="cash" value="13000" class="w-full rounded-lg border-slate-300 shadow-sm p-1.5 border focus:ring-blue-500 focus:border-blue-500" oninput="calculateRisk()">
                </div>
            </div>

            <div class="bg-slate-50 p-3 rounded-lg border border-slate-200">
                <h3 class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Initial Entry</h3>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">Initial Longs</label>
                        <input type="number" id="initLongs" value="0" min="0" class="w-full rounded-lg border-slate-300 shadow-sm p-1.5 border focus:ring-blue-500 focus:border-blue-500" oninput="calculateRisk()">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">Initial Shorts</label>
                        <input type="number" id="initShorts" value="0" min="0" class="w-full rounded-lg border-slate-300 shadow-sm p-1.5 border focus:ring-blue-500 focus:border-blue-500" oninput="calculateRisk()">
                    </div>
                </div>
            </div>

            <div class="bg-slate-50 p-3 rounded-lg border border-slate-200">
                <h3 class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Total Scaled Size</h3>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">Active Longs</label>
                        <input type="number" id="totalLongs" value="0" min="0" class="w-full rounded-lg border-slate-300 shadow-sm p-1.5 border focus:ring-blue-500 focus:border-blue-500" oninput="calculateRisk()">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">Active Shorts</label>
                        <input type="number" id="totalShorts" value="0" min="0" class="w-full rounded-lg border-slate-300 shadow-sm p-1.5 border focus:ring-blue-500 focus:border-blue-500" oninput="calculateRisk()">
                    </div>
                </div>
            </div>
        </div>

        <div id="result" class="mt-5 p-4 rounded-lg border transition-colors duration-200">
            <h2 id="status" class="text-lg font-black tracking-tight"></h2>
            <div class="mt-2 text-xs font-medium">
                <p id="limits" class="mb-1"></p>
                <p id="explanation" class="opacity-80"></p>
            </div>

            <div id="pointsBox" class="mt-3 p-2 rounded border">
                <p id="points" class="font-bold text-sm"></p>
            </div>
        </div>
    </div>

   <script>
        function calculateRisk() {
            const vix = parseFloat(document.getElementById('vix').value) || 0;
            const cash = parseFloat(document.getElementById('cash').value) || 0;
            const initLongs = parseInt(document.getElementById('initLongs').value) || 0;
            const initShorts = parseInt(document.getElementById('initShorts').value) || 0;
            const totalLongs = parseInt(document.getElementById('totalLongs').value) || 0;
            const totalShorts = parseInt(document.getElementById('totalShorts').value) || 0;

            let isSafe = true;
            let rule = "";
            let limitDisplay = "";
            let pointsToWait = 0;

            // 1. Calculate Leverage Limits
            if (vix >= 20) {
                if (cash >= 15000) {
                    rule = "VIX ≥ 20 & Cash ≥ $15k: Initial entry up to 1L and 1S. Can scale to 3 max.";
                    limitDisplay = "Max Initial: 1L | 1S. Max Total: 3L | 3S.";
                    isSafe = (initLongs <= 1) && (initShorts <= 1) && (totalLongs <= 3) && (totalShorts <= 3);
                } else {
                    rule = "VIX ≥ 20 & Cash < $15k: Initial entry restricted to 1 contract TOTAL. Can scale to 3 max.";
                    limitDisplay = "Max Initial: 1 Total (L or S). Max Total: 3L | 3S.";
                    isSafe = ((initLongs + initShorts) <= 1) && (totalLongs <= 3) && (totalShorts <= 3);
                }
            } else if (vix > 17.50 && vix < 20) {
                if (cash >= 15000) {
                    rule = "17.50 < VIX < 20 & Cash ≥ $15k: Capped at 2L and 2S total. No scaling beyond this.";
                    limitDisplay = "Max Total Allowed: 2L | 2S.";
                    isSafe = (initLongs <= 2) && (initShorts <= 2) && (totalLongs <= 2) && (totalShorts <= 2);
                } else {
                    rule = "17.50 < VIX < 20 & Cash < $15k: Capped at 1L and 1S total. No scaling beyond this.";
                    limitDisplay = "Max Total Allowed: 1L | 1S.";
                    isSafe = (initLongs <= 1) && (initShorts <= 1) && (totalLongs <= 1) && (totalShorts <= 1);
                }
            } else {
                rule = "VIX ≤ 17.50: Initial entry up to 2L and 1S. Can scale to 4L and 3S max.";
                limitDisplay = "Max Initial: 2L | 1S. Max Total: 4L | 3S.";
                isSafe = (initLongs <= 2) && (initShorts <= 1) && (totalLongs <= 4) && (totalShorts <= 3);
            }

            // 2. Calculate Points to Wait
            if (vix > 25) {
                pointsToWait = 50;
            } else if (vix > 20) {
                pointsToWait = 40;
            } else if (vix >= 17.50) {
                pointsToWait = 30;
            } else {
                pointsToWait = 20;
            }

            // 3. Update the UI
            const resultDiv = document.getElementById('result');
            const statusText = document.getElementById('status');
            const limitsText = document.getElementById('limits');
            const explanationText = document.getElementById('explanation');
            const pointsText = document.getElementById('points');
            const pointsBox = document.getElementById('pointsBox');

            if (isSafe) {
                resultDiv.className = "mt-5 p-4 rounded-lg border bg-emerald-50 border-emerald-200 text-emerald-800";
                statusText.innerText = "✓ SAFE (Within Limits)";

                // Set scaling trigger color to green to match SAFE status
                pointsBox.className = "mt-3 p-2 rounded border bg-emerald-100 border-emerald-200";
                pointsText.className = "font-bold text-sm text-emerald-900";
            } else {
                resultDiv.className = "mt-5 p-4 rounded-lg border bg-rose-50 border-rose-200 text-rose-800";
                statusText.innerText = "⚠ OVERLEVERAGED";

                // Set scaling trigger color to red to match OVERLEVERAGED status
                pointsBox.className = "mt-3 p-2 rounded border bg-red-100 border-red-200";
                pointsText.className = "font-bold text-sm text-red-900";
            }

            limitsText.innerText = limitDisplay;
            explanationText.innerText = rule;
            pointsText.innerText = `Scaling Trigger: Wait ${pointsToWait} points before adding to positions.`;
        }

        // Initialize on load
        calculateRisk();
    </script>
</body>
</html>
